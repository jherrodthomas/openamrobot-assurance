# Decision register: questions that wait on the project lead.
# Format and lifecycle: README.md in this folder. Checked by check_decisions.py.
# The decision inbox page is generated from this file (build_inbox.py); answers saved on the page
# are copied back here, applied, and then recorded where the project keeps the decision.

- id: DQ-001
  ref: GAP-00
  question: "Do we fork OpenAMRobot, or contribute the assurance work upstream?"
  context: >-
    Upstream (Botshare LTD) publishes under MIT, CERN-OHL-P-2.0 and CC BY 4.0, so a fork is allowed. Contributing
    upstream instead means their contributor agreement, which transfers economic rights in contributions to
    Botshare, and their release gates and two-approval rule on safety paths. **You answered this in chat on
    2026-10-20: fork.** Recorded here so the register is complete.
  reversibility: easy
  decider: lead
  blocks: "Where the forked platform repositories and this record live"
  gate: G0
  asked: 2026-10-20
  batch: 1
  options:
    - key: A
      recommended: true
      title: "Fork the three platform repositories and keep this record separate"
      detail: "Our own record, our own pace. Cost: our fixes reach upstream only through pull requests we choose to open, and the fork must not imply Botshare's endorsement."
    - key: B
      title: "Contribute upstream only"
      detail: "No fork to maintain. Cost: the contributor agreement, upstream's review cadence, and no control over what the record claims."
  sources: ["openAMRobot/.github GOVERNANCE.md (Releases and official status)", "openAMRobot/.github INDIVIDUAL_CONTRIBUTOR_AGREEMENT.md", "chat 2026-10-20"]
  status: answered
  answer: {choice: A, via: chat, at: 2026-10-20}

- id: DQ-002
  ref: GAP-00
  question: "Which robot do we assess first: the Gate A unit that exists, or the 2.0 design?"
  context: >-
    The public repositories hold the **Gate A unit** (v0.0.1: Raspberry Pi 5, Teensy 4.0, ZBLD drivers, no E-stop,
    no brakes). OpenAMRobot 2.0 (Jetson, STM32 base controller, hub motors with brakes, a Pilz PNOZ s3 safety
    relay, two E-stops, arms and a lift) is decided in upstream's private plan set and due as v2.0.0-rc.1 on
    20 November 2026, but its design is not in any repository yet. A safety case can only be built on what can
    be read and tested.
  reversibility: revisit
  decider: lead
  blocks: "The reference configuration named in every work product; the scope of the risk assessment"
  gate: G0
  asked: 2026-10-20
  batch: 1
  options:
    - key: A
      recommended: true
      title: "Assess the Gate A unit now; track 2.0 decisions and switch when its code and drawings are public"
      detail: "Findings are verifiable today and most carry over (the ROS 2 stack and firmware pattern stay). Cost: hardware findings on Gate A (no E-stop, no brakes, no fuse) will be overtaken by 2.0 and must be re-stated then."
    - key: B
      title: "Wait for the 2.0 release candidate and assess that"
      detail: "One assessment of the robot that will ship. Cost: nothing to do for a month, and 2.0's safety chain exists only in Botshare's documents, which we cannot verify."
    - key: C
      title: "Assess both as two configurations from the start"
      detail: "Most complete. Cost: doubles every work product while 2.0 is still moving (the register changed five times in October)."
  sources: ["openAMRobot/.github decisions.yaml BASE-CONTROLLER-GATES, RELEASE-MILESTONES, SAFETY-PROCUREMENT", "openamr-platform-hw product-architecture.md"]
  status: applied
  answer: {choice: A, via: chat, at: 2026-10-20}
  applied: {ref: "openamrobot-assurance main", record: "WP-C-01 §1 and header (reference configuration: Gate A unit); WP-C-03 header", at: 2026-10-20}

- id: DQ-003
  ref: GAP-00
  question: "Which regulatory frame do we build the safety case for: EU machinery, US industrial mobile robots, or both?"
  context: >-
    Botshare is in Cyprus and the robot is sold in Europe, so the Machinery Regulation (EU) 2023/1230 applies from
    20 January 2027 and ISO 3691-4 plus ISO 13849-1 are the harmonised route. The US market uses ANSI/A3 R15.08
    instead. The choice fixes which standards every requirement cites and which conformity file we build.
  reversibility: hard
  decider: lead
  blocks: "Standard references in every work product; the structure of 10-safety-case"
  gate: G0
  asked: 2026-10-20
  batch: 1
  options:
    - key: A
      recommended: true
      title: "EU frame: Machinery Regulation, ISO 12100, ISO 3691-4, ISO 10218, ISO 13849-1"
      detail: "Matches where the robot is made and sold and gives one conformity file. Cost: a US deployment later needs an R15.08 mapping, mostly a cross-reference."
    - key: B
      title: "US frame: ANSI/A3 R15.08 with ISO 13849-1 for the control system"
      detail: "Right if the first deployment is in the US. Cost: no CE route; EU sale needs the whole file redone."
    - key: C
      title: "Both from the start"
      detail: "Covers either market. Cost: two sets of clause references in every document and two conformity files to keep aligned."
  sources: ["Regulation (EU) 2023/1230 Art. 54 (application date)", "ISO 3691-4:2023 scope", "ANSI/A3 R15.08-1:2020 scope"]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-20}
  applied: {ref: "openamrobot-assurance main", record: "WP-M-01 §8 D-03; WP-M-13 §2 and §6; every work product's standard references are the EU frame already", at: 2026-10-20}

- id: DQ-004
  ref: GAP-00
  question: "Is the first safety case for the mobile base only, or for the base with the arms and lift?"
  context: >-
    The base is a driverless industrial truck under ISO 3691-4. The dual arms (OpenArm 2.0) and the lift are
    collaborative-robot and lifting hazards under ISO 10218 and ISO/TS 15066, each with its own risk assessment,
    force limits and stop functions. Upstream has no arm or lift code in the platform repositories today.
  reversibility: revisit
  decider: lead
  blocks: "Machine limits in the item definition; the hazard list; the number of safety functions"
  gate: G1
  asked: 2026-10-20
  batch: 1
  options:
    - key: A
      recommended: true
      title: "Base only first; arms and lift as a second item when their code is public"
      detail: "A complete, verifiable case for what exists, then extend. Cost: the base case must already state the interface assumptions the arms will need (stop chain, payload, centre of gravity)."
    - key: B
      title: "Whole mobile manipulator from the start"
      detail: "One item, one risk assessment. Cost: most of it would be assumptions about hardware and software we cannot read, and the case cannot close until 2.0 ships."
  sources: ["openAMRobot/.github decisions.yaml LIFT, ARM-MOUNT", "openamr-platform-hw product-architecture.md"]
  status: applied
  answer: {choice: B, via: inbox, at: 2026-10-20}
  applied: {ref: "openamrobot-assurance main", record: "WP-C-01 v0.4 (item on CFG-001 and CFG-002); WP-C-02 v0.2 T-09…T-11; WP-C-03 v0.4 H-13…H-15; WP-C-04 v0.2 SF-10…SF-12; WP-C-06 v0.2 §4; WP-M-01 T-14", at: 2026-10-20}
  note: "Not the recommendation. Applied after DQ-020 A: the arms and lift are in the item on CFG-002, the 2.0 mobile manipulator, every value quoted from upstream and unverified until its design is public."

- id: DQ-005
  ref: GAP-00
  question: "What Performance Level do we set as the target for the stop functions: PL d, or PL c with a restricted operating area?"
  context: >-
    ISO 3691-4 expects the emergency stop and the personnel-detection stop of an AMR that shares space with people
    to reach **PL d** (ISO 13849-1), typically Category 3. The Gate A unit reaches no PL at all: its stop is a
    200 ms software watchdog that cuts motor PWM and lets the wheels coast. A lower target is only defensible if
    the robot operates in a separated area with no people, which is an operating-environment limit you accept.
  reversibility: hard
  decider: lead
  blocks: "The required PL of every safety function (SF-01 onward); the hardware safety chain the fork must add"
  gate: G1
  asked: 2026-10-20
  batch: 1
  options:
    - key: A
      recommended: true
      title: "PL d for emergency stop and protective stop; people share the space"
      detail: "Matches ISO 3691-4 for collaborative zones and upstream's own 2.0 safety-chain procurement (Pilz PNOZ s3, dual-channel E-stops, contactors). Cost: a safety-rated scanner or bumpers, a safety relay and motor brakes must be added to any Gate A unit we test with."
    - key: B
      title: "PL c, operation only in a fenced or marked area with no people"
      detail: "Cheaper hardware. Cost: the operating environment shrinks to a separated test cell; any demonstration around people is outside the case."
    - key: C
      title: "Defer: set the PL after the risk assessment"
      detail: "Methodologically clean (the PLr comes from the risk graph). Cost: the risk graph for an AMR around people lands on PL d anyway, so the hardware gap stays open a month longer."
  sources: ["ISO 3691-4:2023 §5.3 (safety-related parts), Annex A", "ISO 13849-1:2023 Annex A (PLr)", "openamr-platform-fw docs/safety/motion-safety.md", "openAMRobot/.github decisions.yaml SAFETY-PROCUREMENT"]
  status: applied
  answer: {choice: A, via: chat, at: 2026-10-20}
  applied: {ref: "openamrobot-assurance main", record: "WP-C-03 header and §7 (PLr d for SF-01, SF-02, SF-03); WP-S-02", at: 2026-10-20}

- id: DQ-006
  ref: GAP-06
  question: "Where should the firmware's own speed ceiling sit: at the navigation limit, or at the mechanical clamp?"
  context: >-
    The hardened firmware now refuses any `/cmd_vel` above a ceiling before it reaches the motors. Today the
    ceiling equals the existing 68 rpm clamp (0.71 m/s), so nothing changes for valid commands. Navigation never
    asks for more than 0.20 m/s and 0.5 rad/s, but teleoperation, docking and anything else on the network can,
    and that path has no other limit until an independent speed monitor (SF-03) exists.
  reversibility: easy
  decider: lead
  blocks: "The value of CMD_VEL_MAX_LINEAR_MPS and CMD_VEL_MAX_ANGULAR_RPS in the firmware; WP-C-03 SF-03 interim measure"
  gate: G1
  asked: 2026-10-20
  batch: 1
  proceed_after: 2026-10-27
  options:
    - key: A
      recommended: true
      title: "Navigation limit plus margin: 0.25 m/s and 0.6 rad/s"
      detail: "Every path to the motors, including teleop and docking, is capped near what the risk assessment rates. Cost: a bench test that needs faster motion must flash a bench image with a different define."
    - key: B
      title: "Keep the mechanical clamp: 0.71 m/s and 3.1 rad/s"
      detail: "No behaviour change at all. Cost: a stray teleop or docking command can still drive the robot at 3.5 times the navigation speed."
    - key: C
      title: "Make it a runtime parameter the host sets at start-up"
      detail: "Flexible per zone. Cost: another unauthenticated input that changes a safety limit, which is what the hardening removed."
  sources: ["change-2026-10-20-fw-hardening.md §1 item 3", "WP-C-03 SF-03", "sw: nav2_params.yaml:116-120", "gap assessment GAP-06, GAP-36"]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-20}
  applied: {ref: "openamr-platform-fw claude/wonderful-einstein-kr3bsf fe673fb", record: "firmware.ino CMD_VEL_MAX_LINEAR_MPS 0.25, CMD_VEL_MAX_ANGULAR_RPS 0.6; docs/safety/motion-safety.md; WP-S-02 SR-03.04; change-2026-10-20-fw-hardening §4", at: 2026-10-20}

- id: DQ-007
  ref: WP-S-03 OI-2
  question: "What detects people on the Gate A bench build: a safety laser scanner, safety bumpers, or neither (fenced operation only)?"
  context: >-
    You set PL d with people sharing the space, so the protective stop (SF-02) needs a safety-rated device wired
    into the stop chain; the LiDAR cannot do it. A scanner sees ahead and can switch fields by speed; bumpers
    are cheap and cover the low-object gap but stop by contact. This is a purchase, and it decides whether the
    Gate A unit can ever be tested around people or stays fenced until 2.0.
  reversibility: revisit
  decider: lead
  blocks: "WP-S-03 §3.4 design; SF-02 validation; the bench-build bill of materials"
  gate: G2
  asked: 2026-10-20
  batch: 1
  options:
    - key: A
      recommended: true
      title: "Safety laser scanner (type 3, OSSD) at the front, plus a rear bumper"
      detail: "Full SF-02 at PL d including reverse. Cost: roughly €2,000 to €4,000 for a small scanner (e.g. SICK nanoScan3 or TiM-S class) plus a bumper and monitoring unit; mounting below the chassis lip."
    - key: B
      title: "Safety bumpers front and rear only"
      detail: "Under €500. Cost: contact before stop, so the speed limit drops to the crawl limit wherever bumpers are the only detection; no field switching for docking."
    - key: C
      title: "No device on Gate A; fenced operation until 2.0"
      detail: "No purchase. Cost: nothing on Gate A can be demonstrated around people; SF-02 evidence waits for a 2.0 design that today names no detection device either."
  sources: ["WP-C-03 §7 SF-02", "WP-S-02 SR-02.01…SR-02.07", "WP-S-03 §3.4, §7", "gap assessment GAP-14, GAP-22"]
  status: applied
  answer: {choice: A, via: chat, at: 2026-10-20}
  applied: {ref: "openamrobot-assurance main", record: "WP-S-03 §3.4; WP-H-02 (bench-build safety chain design)", at: 2026-10-20}

- id: DQ-008
  ref: change-2026-10-20-fw-hardening §4
  question: "Stall-detector thresholds in the firmware: 60 % PWM, below 2 rpm, for 1 s, cleared after 1 s of zero command"
  context: >-
    The fork firmware latches a motion fault when a wheel is driven hard but does not turn. The thresholds are
    engineering estimates from the measured stick-slip floor (4 rpm) and the PWM the drive needs at that floor.
    They are reversible constants that the bench test will tune.
  reversibility: easy
  blocks: "nothing; recorded so the bench test knows what to check"
  gate: G2
  asked: 2026-10-20
  batch: 1
  decider: claude
  proceed_after: 2026-10-20
  options:
    - key: A
      recommended: true
      title: "Keep 60 % / 2 rpm / 1 s / 1 s until the bench test"
      detail: "Trips on a blocked wheel or a dead encoder within a second; a heavy ramp start could trip it, which the bench test will show. Cost: possible nuisance trips during commissioning."
    - key: B
      title: "Looser: 80 % / 1 rpm / 2 s"
      detail: "Fewer nuisance trips. Cost: a pivoting robot runs two seconds longer on one wheel."
  sources: ["change-2026-10-20-fw-hardening.md §1 item 7, §3", "fw: docs/safety/motion-safety.md (velocity floors)"]
  status: assumed
  answer: {choice: A, via: assumed, at: 2026-10-20}

- id: DQ-009
  ref: WP-M-13
  question: "Which route to conformity do we plan for under the Machinery Regulation: self-declaration against the harmonised standards, or a notified body's type-examination?"
  context: >-
    Regulation (EU) 2023/1230 applies from 20 January 2027. An AMR that is not in its Annex I high-risk list may be
    self-declared (Module A, internal control) if the harmonised standards covering every essential requirement are
    applied in full; otherwise a notified body examines the type (Modules B and C) or certifies a quality system
    (Module H). Our strategy keeps every learned component outside the safety functions, so the Annex I Part A
    trigger (self-evolving safety behaviour) does not apply. The route decides whether a notified body is a planned
    cost and who checks the technical file.
  reversibility: revisit
  decider: lead
  blocks: "The confirmation measure NB-1 in WP-M-06; the budget line for a notified body; the shape of the technical documentation index WP-K-02"
  gate: G0
  asked: 2026-10-20
  batch: 1
  options:
    - key: A
      recommended: true
      title: "Plan for self-declaration (Module A) with ISO 3691-4, ISO 13849-1, EN 60204-1 and ISO 13850 applied in full"
      detail: "No notified-body fee; one technical file. Cost: the standards must be bought and applied without deviation, and the presumption of conformity only holds once the Commission cites them under the new Regulation. Any later external examination is voluntary."
    - key: B
      title: "Plan for a voluntary EU type-examination (Modules B and C) from the start"
      detail: "An independent body reads the technical file, which the project otherwise lacks. Cost: a fee in the four to five figures and scheduling around the body; could be the same party as the assessor of DQ-010."
    - key: C
      title: "Decide at G2, once the architecture and the detection means are fixed"
      detail: "Nothing is committed now. Cost: WP-M-13 and WP-M-06 carry a placeholder for a notified body for two gates, and the budget cannot be planned."
  sources: ["Regulation (EU) 2023/1230 Art. 25, Annex I, Annexes VI–X", "assurance/01-management/WP-M-13-regulatory-conformity-strategy.md §3", "assurance/01-management/WP-M-06-confirmation-measures-plan.md §8"]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-20}
  applied: {ref: "openamrobot-assurance main", record: "WP-M-13 §3 (Module A decided); WP-M-06 §2 and §8 (NB-1 withdrawn); WP-M-02 §3.1 (no notified body)", at: 2026-10-20}

- id: DQ-010
  ref: WP-M-06
  question: "When do we engage an independent functional safety assessor: now, at the concept gate, or not for now?"
  context: >-
    Every confirmation review and the functional safety assessment need someone independent of the author, and the
    project has one person. Two measures are already due at G0 (the impact analysis and the safety plan) and six at
    G1, including the review of the risk assessment that G1 cannot pass without. Without an answer, every I3
    measure stays unscheduled. An assessor with ISO 13849-1 and
    ISO 3691-4 experience costs money and time to brief; without one, no work product can ever leave draft.
  reversibility: revisit
  decider: lead
  blocks: "Every confirmation measure in WP-M-06 §9; the G0 exit criterion 'plans approved'; the WP-M-02 role 'External functional safety assessor'"
  gate: G0
  asked: 2026-10-20
  batch: 1
  options:
    - key: A
      recommended: true
      title: "Identify and brief an assessor now; first paid measure at G1 (the risk assessment review)"
      detail: "The concept phase gets an outside eye when it matters most, and the tailoring is confirmed before it shapes two more gates. Cost: a fee per measure from G1, and a few hours of the lead's time to find and brief someone."
    - key: B
      title: "Engage at G2, after the risk assessment and the safety functions exist"
      detail: "More to show, fewer billable hours. Cost: G1 passes with its confirmation reviews deferred, and a rejected risk assessment at G2 re-opens the whole concept."
    - key: C
      title: "Not for now; record every I2 and I3 measure as unscheduled"
      detail: "No cost. Cost: nothing leaves draft, no gate can pass on its own terms, and the record stays a self-assessment until this changes."
  sources: ["assurance/01-management/WP-M-06-confirmation-measures-plan.md §4, §6, OI-3, OI-5", "assurance/01-management/WP-M-02-safety-plan.md §3.1"]
  status: applied
  answer: {choice: C, via: inbox, at: 2026-10-20}
  applied: {ref: "openamrobot-assurance main", record: "WP-M-06 §1 and §11 (every I2 and I3 measure unscheduled); WP-M-02 §3.1 and OI-3", at: 2026-10-20}

- id: DQ-011
  ref: GAP-01
  question: "Do we buy and fit the bench safety hardware before any on-ground test: a battery fuse and disconnect, a dual-channel E-stop through a safety relay, and driver fault read-back?"
  context: >-
    As inherited, the Gate A unit's only stop is a software watchdog on the same core that drives the motors; the
    24 V bus has no fuse and no switch. The hold point WP-V-07 says no robot is driven under the fork's control
    until a pendant E-stop drops the driver supply through a safety relay, the battery is fused and switchable, and
    both drivers' fault outputs stop the motors. The parts are bench equipment, not the product design, but the
    safety relay can be the one upstream's 2.0 chain already names. Measuring the stopping distance, the number the
    whole concept hangs on, is the first test behind this hold point.
  reversibility: easy
  decider: lead
  blocks: "Every on-ground test (WP-V-07 conditions C-1 to C-3); the first stopping-distance measurement (WP-V-02); the first change record under 07-supporting/impact/"
  gate: G1
  asked: 2026-10-20
  batch: 1
  proceed_after: 2026-11-03
  options:
    - key: A
      recommended: true
      title: "Buy it now: a certified safety relay, two NC E-stop contacts on a pendant, a fused and switched battery lead, and the ERR/DO1 wiring"
      detail: "Roughly €300 to €600 with a Pilz PNOZ s3 or equivalent; a weekend to fit and test. Cost: money spent on a unit the 2.0 design will replace, though the relay and the pendant carry over."
    - key: B
      title: "Buy the cheapest workable set: a fused lead, a single-channel E-stop contactor, no relay"
      detail: "Under €150. Cost: single channel is Category B at best and the design is thrown away; the pre-session check still works."
    - key: C
      title: "No on-ground tests until the 2.0 base with its chain exists"
      detail: "Nothing spent. Cost: no stopping-distance, stability or detection data for at least two months; the concept phase proceeds on estimates."
  sources: ["assurance/06-validation/WP-V-07-test-operations.md §2", "assurance/00-assessment/gap-assessment.md GAP-01, GAP-02, GAP-04, GAP-19, §10 action 4", "openAMRobot/.github decisions.yaml SAFETY-PROCUREMENT"]
  status: applied
  answer: {choice: C, via: inbox, at: 2026-10-20}
  applied: {ref: "openamrobot-assurance main", record: "WP-V-07 §2 (hold point not expected to open on the Gate A unit); WP-H-02 warning (first draft of the 2.0 chain, not an order); WP-C-02 v0.2 Z1 and Figure 3-1 (bench only on CFG-001); WP-C-01 v0.4 §1 (CFG-001 bench only)", at: 2026-10-20}
  note: "Not the recommendation. No on-ground test on the Gate A unit until the 2.0 base with its chain exists; the stopping-distance measurement (WP-C-01 OI-2) waits for 2.0."

- id: DQ-012
  ref: WP-M-02
  question: "While the project has one person, who approves the work products the safety manager writes, and do you accept self-approval as a recorded interim limitation?"
  context: >-
    The safety plan gives the safety manager approval of safety work products, and the same person writes them. A
    verification review needs someone other than the author (I1); nobody holds that role. One honest option is to
    record self-approval as an accepted interim limitation with the gap stated in every header, and to treat every
    review as I0 until a second person joins. The alternative is to find a volunteer reviewer now, or to let the assessor of
    DQ-010 take the reviewer role for the few documents that matter.
  reversibility: easy
  decider: lead
  blocks: "The WP-M-02 roles 'Verification reviewer(s)' and 'Quality assurance'; whether any work product can move from Draft to Approved; the G0 exit criterion 'roles assigned'"
  gate: G0
  asked: 2026-10-20
  batch: 1
  options:
    - key: A
      recommended: true
      title: "Self-approval as a recorded interim limitation, stated in every header, with every review logged as I0"
      detail: "Honest and cheap; the record says what it is. Cost: nothing leaves Draft and every claim stays unaccepted until a reviewer exists."
    - key: B
      title: "Find a volunteer reviewer with machinery safety experience before G0"
      detail: "Gives I1 reviews and lets drafts be approved. Cost: finding and keeping a volunteer; their time is the project's critical path."
    - key: C
      title: "Give the assessor of DQ-010 the verification reviewer role for the plans and the risk assessment"
      detail: "One engagement covers both. Cost: more billable hours, and the assessor then cannot confirm what they reviewed (independence)."
  sources: ["assurance/01-management/WP-M-02-safety-plan.md §3.1, OI-1, OI-2", "assurance/01-management/WP-M-01-assurance-strategy.md T-09"]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-20}
  applied: {ref: "openamrobot-assurance main", record: "WP-M-02 §3.1 (self-approval as a recorded interim limitation, every review logged as I0) and OI-2", at: 2026-10-20}

- id: DQ-013
  ref: GAP-27
  question: "What security level do we target for the robot under IEC 62443-4-2: SL 1 (casual misuse) or SL 2 (an intentional attacker with simple means)?"
  context: >-
    Today anyone on the ROS 2 domain can move the robot, trigger docking, switch off the collision monitor or change
    the control gains, and the on-screen E-stop is a network request. The security level target fixes how much
    authentication, integrity and segmentation the fork must build and verify. SL 1 is reachable with SROS2 and a
    login on the operator UI; SL 2 adds signed images, protected parameters and penetration testing. The safety
    chain is designed to need neither: no attack on the software can hold a contactor closed.
  reversibility: revisit
  decider: lead
  blocks: "The component requirements CR 1–7 in WP-C-08; the scope of WP-W-11 and WP-V-06; the cost of penetration testing"
  gate: G1
  asked: 2026-10-20
  batch: 2
  options:
    - key: A
      recommended: true
      title: "SL 2 for identification, integrity, segmentation and availability (FR 1, 3, 5, 7); SL 1 for the rest"
      detail: "Covers a person on the same Wi-Fi with public tools, which is the realistic threat in a workshop. Cost: signed images, protected parameters and a penetration test before release."
    - key: B
      title: "SL 1 throughout"
      detail: "SROS2, a login and pinned builds. Cost: an intentional attacker on the network is out of scope, which the operating-environment limits must then say."
    - key: C
      title: "SL 2 throughout"
      detail: "Simplest to state. Cost: SL 2 on use control and data confidentiality buys little for a robot with no personal data and adds verification effort."
  sources: ["assurance/00-assessment/gap-assessment.md GAP-27, GAP-28, GAP-29", "assurance/02-concept/WP-C-08-cybersecurity-requirements-and-sl-target.md §2", "IEC 62443-4-2:2019 §4 (security levels)"]
  status: open

- id: DQ-014
  ref: GAP-03
  question: "Where do the safety functions live: on a hardwired safety chain alone, with the firmware as a functional layer, or with the Teensy firmware inside the safety-related control system?"
  context: >-
    The strategy allocates every safety function to a hardwired chain (E-stops and scanner outputs into a safety
    relay that drops two contactors and engages the brakes) and treats the firmware and the ROS 2 stack as
    functional layers that are hardened but carry no Performance Level. Upstream's own principle says the same.
    The alternative, making the firmware part of the SRP/CS, would let software contribute to the stop, but it
    means a PL d software lifecycle on code that has no tests today and a second channel for a single Teensy.
  reversibility: hard
  decider: lead
  blocks: "The SRP/CS architecture WP-S-03; the scope of the software work products WP-W-02 to WP-W-08; the tailoring decisions T-03 and T-04"
  gate: G2
  asked: 2026-10-20
  batch: 1
  options:
    - key: A
      recommended: true
      title: "Hardwired chain only; the firmware is hardened as defence in depth with no PL claim"
      detail: "The PL d argument stays inside certified components with known reliability data, and matches upstream's 'telemetry is not safety evidence'. Cost: every safety function needs a hardware path, including safe speed, which means a scanner with field switching or a speed monitor."
    - key: B
      title: "Firmware inside the SRP/CS for the speed and loss-of-control functions; the chain for the E-stop and protective stop"
      detail: "Lets software do what hardware does badly (speed limits per zone). Cost: ISO 13849-1 §7 software lifecycle at PL d on the firmware, a reproducible build, tests, static analysis and a second channel or diverse monitor."
    - key: C
      title: "Defer until the firmware has a verification history, then promote it if the evidence supports it"
      detail: "Keeps the door open. Cost: the architecture is designed twice if the answer is later B."
  sources: ["assurance/01-management/WP-M-01-assurance-strategy.md §5 T-03, T-04, §6", "assurance/00-assessment/gap-assessment.md GAP-03, GAP-11", "openAMRobot/.github decisions.yaml TELEMETRY-NOT-SAFETY-EVIDENCE, ESTOP-SCOPE"]
  status: applied
  answer: {choice: B, via: inbox, at: 2026-10-20}
  applied: {ref: "openamrobot-assurance main", record: "WP-C-04 v0.2 §5 (firmware as channel 1 of SF-03, SF-04, SF-06, SF-09); WP-S-03 v0.3 §2 and §3.5 (two-channel architecture); WP-M-01 T-03 and T-04; the software work products widen under WP-S-03 OI-6", at: 2026-10-20}
  note: "Not the recommendation. The firmware is channel 1 of the speed and loss-of-control functions and carries a PL claim with the ISO 13849-1 §7 lifecycle; the hardwired monitor is channel 2."

- id: DQ-015
  ref: WP-C-04
  question: "What does the emergency stop do: remove actuator power at once and let the brakes stop the robot (stop category 0), or brake under control first and then remove power (category 1)?"
  context: >-
    EN 60204-1 lets an E-stop be category 0 (immediate removal of power) or category 1 (controlled stop, then
    power removed). You answered DQ-014 with B, so the firmware joins the safety-related control system for the
    speed and loss-of-control functions; that removes the main objection to category 1, which puts the firmware's
    braking in the stop path for the first second. You also answered DQ-011 with C, so the drive that matters is
    the 2.0 hub motor whose brake engages on power loss, not the brakeless Gate A drive. Category 0 stays the
    simplest: the relay drops the contactors and the brakes hold. Category 1 stops shorter on a loaded robot but
    needs a delayed-drop safety relay and makes the firmware's braking part of the emergency stop at PL d.
  reversibility: revisit
  decider: lead
  blocks: "SF-01 in WP-C-04; the stopping-distance budget WP-S-04; the contactor and brake design in WP-H-02"
  gate: G1
  asked: 2026-10-20
  batch: 2
  after: [DQ-014]
  options:
    - key: A
      recommended: true
      title: "Category 0: the relay drops the contactors and the brakes engage on power loss; a mechanical brake is a condition of any configuration that carries payload"
      detail: "No software in the stop path; validated by a measured stopping distance. Cost: the Gate A unit coasts until it has brakes, so its speed limit and payload stay low."
    - key: B
      title: "Category 1: the firmware brakes under control, then the relay removes power after a fixed delay"
      detail: "Shorter stops, less load on the mechanics. Cost: a delayed-drop safety relay, and the firmware's braking becomes part of the safety function (DQ-014 option B)."
  sources: ["EN 60204-1:2018 §9.2 (stop categories), ISO 13850:2015 §4", "assurance/02-concept/WP-C-04-safety-functions-and-plr.md §2, §3.1, §7", "openAMRobot/.github decisions.yaml ESTOP-SCOPE, DRIVETRAIN"]
  status: open

- id: DQ-016
  ref: WP-M-06
  question: "Do we buy the standards now (ISO 12100, ISO 3691-4, ISO 13849-1 and -2, EN 60204-1, ISO 13850, about €1,000 to €1,500), or only when an assessor is engaged?"
  context: >-
    Every clause reference in the record is written from memory and marked to be checked against a licensed copy.
    ISO 13849-1:2023 renumbered its clauses, ISO 3691-4:2023 is new, and the Machinery Regulation's harmonised list
    is still being built. An assessor will check against the real text; writing two more gates of documents against
    the wrong clause numbers costs more to fix than the standards cost to buy.
  reversibility: easy
  decider: lead
  blocks: "WP-M-06 OI-1 (clause check); the credibility of every clause column in WP-M-00"
  gate: G0
  asked: 2026-10-20
  batch: 1
  proceed_after: 2026-11-03
  options:
    - key: A
      recommended: true
      title: "Buy ISO 13849-1:2023, ISO 3691-4:2023 and EN 60204-1:2018 now; the rest when their work products start"
      detail: "The three that every work product cites, roughly €600. Cost: the money, and the clause check becomes a task for the next session."
    - key: B
      title: "Buy the full set now"
      detail: "Everything checked at once. Cost: roughly €1,500, some of it for standards (ISO 10218, ISO/TS 15066) the base does not need yet."
    - key: C
      title: "Buy nothing until an assessor is engaged"
      detail: "No cost now. Cost: every clause reference stays unverified through G1 and G2, and the assessor's first finding is predictable."
  sources: ["assurance/01-management/WP-M-06-confirmation-measures-plan.md OI-1", "assurance/01-management/WP-M-00-work-product-register.md (note on clause numbers)"]
  status: applied
  answer: {choice: C, via: inbox, at: 2026-10-20}
  applied: {ref: "openamrobot-assurance main", record: "WP-M-06 OI-1 (clause checks unscheduled; every clause reference stays marked); WP-C-03 OI-7; WP-C-04 OI-4", at: 2026-10-20}

- id: DQ-017
  ref: WP-C-02
  question: "What is the default speed limit when a person is in the robot's zone: walking pace, a fraction of it, or zero (the robot waits)?"
  context: >-
    ISO 3691-4 ties the permitted speed in shared zones to the detection means and the stopping distance. Until
    the detection means (DQ-007) and the stopping distance (WP-V-02) are known, the fork needs a default for the
    operating-environment limits and for the test procedure. The Nav2 limit as committed is 0.20 m/s; upstream's
    2.0 ceiling is 1.5 m/s as an analytical limit.
  reversibility: easy
  decider: lead
  blocks: "The zone limits in WP-C-02; the development limits in WP-V-07 §3; the safely-limited-speed function SF-03"
  gate: G1
  asked: 2026-10-20
  batch: 2
  after: [DQ-007]
  options:
    - key: A
      recommended: true
      title: "0.3 m/s with a safety-rated detection means in the zone; 0 m/s (wait) without one"
      detail: "A person can step out of the way of 0.3 m/s and the measured stopping distance will be short. Cost: slow transport in shared zones; the robot waits whenever detection is unavailable."
    - key: B
      title: "0.5 m/s with detection; 0.1 m/s without"
      detail: "More useful throughput. Cost: a longer stopping distance and larger protective fields; 0.1 m/s without detection is still motion toward a person nothing sees."
    - key: C
      title: "Zero in any zone with a person until the arms question is settled, since the base will carry them"
      detail: "The most conservative. Cost: no shared-space operation at all in the first configuration."
  sources: ["ISO 3691-4:2023 §4 (speed in shared zones)", "assurance/00-assessment/gap-assessment.md §4.1", "openAMRobot/.github decisions.yaml SPEED-CEILING"]
  status: open

- id: DQ-018
  ref: GAP-35
  question: "Disable the Nav2 back-up recovery and limit every reverse move to the crawl speed on the fork?"
  context: >-
    The robot has no rear sensing except the bumper you just chose, which detects by contact. Nav2's back-up
    recovery reverses blind when the robot is stuck, and the undock routine reverses 0.7 m at 0.10 m/s. With a
    contact bumper as the only rear detection, reverse is defensible only at a crawl, where the bumper stops the
    robot before it pushes. This changes how the robot behaves when stuck: it will spin or wait instead of backing up.
  reversibility: easy
  blocks: "The first fork change to the navigation configuration; SR-02.04; WP-H-02 §3.4"
  gate: G2
  asked: 2026-10-20
  batch: 2
  proceed_after: 2026-10-27
  options:
    - key: A
      recommended: true
      title: "Remove back-up from the recovery list; undock at 0.05 m/s"
      detail: "Reverse only happens in undock, at a speed the bumper can stop. Cost: a stuck robot has one recovery fewer and may need an operator sooner."
    - key: B
      title: "Keep back-up but cap it at 0.05 m/s and 0.2 m"
      detail: "Keeps the recovery. Cost: still a blind reverse, just a short slow one; the bumper is the only thing between the robot and a foot."
    - key: C
      title: "Leave the configuration as upstream has it"
      detail: "No behaviour change. Cost: reverse at 0.10 m/s with no detection stays outside the safety case."
  sources: ["gap assessment GAP-35", "WP-S-02 SR-02.04", "WP-H-02 §3.4", "sw: nav2_params.yaml:303-307", "sw: dock_trigger.yaml:22-23"]
  status: open

- id: DQ-019
  ref: WP-C-03
  question: "Do we keep public floors (showrooms, visitor corridors, anywhere children may be) out of the Gate A unit's operating environment, or open a case for them?"
  context: >-
    The risk assessment, re-rated per zone, puts a robot moving among people who do not know it (children, a
    person lying or crouching below the scanner plane) at the top of the ISO 13849-1 risk graph: required
    Performance Level e, which no function of the bench build is designed to reach. Every other zone rates d or
    below. Keeping the public floor out costs nothing today, since the operating environment already excludes it;
    opening it would need a PL e argument or a measured proof that the robot cannot hurt a child on contact
    (force and kinetic-energy limits), which is a 2.0 question rather than a Gate A one.
  reversibility: easy
  decider: lead
  blocks: "Zone Z5 in WP-C-02; the scope of SF-02 in WP-C-04; the exclusions carried to the information for use (WP-O-03)"
  gate: G1
  after: [DQ-017]
  options:
    - key: A
      recommended: true
      title: "Keep public floors excluded for the Gate A unit; revisit for 2.0 with measured contact forces"
      detail: "The safety case stays at PL d with people who are briefed. Cost: no demonstrations in a showroom or an office corridor with visitors until 2.0."
    - key: B
      title: "Open a PL e argument for the protective stop on the bench build"
      detail: "Would allow public demonstrations. Cost: a category 4 detection chain and a stopping distance proven at PL e, well beyond the budget and the Gate A drive."
    - key: C
      title: "Allow public floors with a chaperone and the robot at crawl speed, as a procedural measure"
      detail: "Cheap. Cost: a procedure is not a control for a hazard that can kill; the gap assessment's own principle, and the rating stays e."
  sources: ["assurance/02-concept/WP-C-03-risk-assessment.md §5 (H-01 public floor), §5.2", "assurance/02-concept/WP-C-02-operating-environment-and-tasks.md Z5", "assurance/02-concept/WP-C-06-human-robot-interaction-and-misuse.md IS-09, MU-07"]
  status: queued

- id: DQ-020
  ref: DQ-004
  question: "With the arms and lift in scope and no on-ground tests on the Gate A unit, does the reference configuration move to the 2.0 design now, or does the Gate A unit stay as the software reference beside it?"
  context: >-
    You answered that the first safety case covers the base with the arms and lift (DQ-004) and that no on-ground
    test runs until the 2.0 base with its safety chain exists (DQ-011). The arms, the lift and the 2.0 chain exist
    only in upstream's private plan set, due as a release candidate on 20 November 2026; the Gate A unit is the
    only hardware whose code and drawings can be read today, and DQ-002 made it the reference configuration. Left
    as they are, the two answers have the concept work products describing a base that will not be driven, and
    the hardware the case is really about undefined in any repository.
  reversibility: revisit
  decider: lead
  blocks: "The reference configuration CFG-001 in every header; which hardware WP-C-01 v0.4, WP-C-03 and WP-C-04 describe; whether WP-H-02 is a bench build or the first draft of the 2.0 chain; the order in which DQ-004 and DQ-014 are applied"
  gate: G1
  asked: 2026-10-20
  batch: 2
  options:
    - key: A
      recommended: true
      title: "Keep the Gate A unit as the software and firmware reference (bench only, wheels off the ground) and add CFG-002, the 2.0 mobile manipulator, as the hardware reference"
      detail: "Nothing already written is thrown away; the firmware and ROS 2 findings stay verifiable on Gate A and carry over. Cost: every concept document names two configurations until 2.0 lands, and the 2.0 rows rest on upstream's documents, marked unverified, not on hardware."
    - key: B
      title: "Move everything to 2.0 now and stop the Gate A work"
      detail: "One configuration. Cost: no verifiable hardware or code for the arms, the lift or the chain for at least a month; every hardware claim is an assumption about a design nobody outside Botshare can read."
    - key: C
      title: "Keep Gate A as the only reference; DQ-004 and DQ-011 take effect when 2.0 is public"
      detail: "Cheapest. Cost: your two answers change nothing until 2.0, and the record keeps describing a bench build you have decided not to buy."
  sources: ["assurance/01-management/decisions/register.yaml DQ-002, DQ-004, DQ-011", "assurance/02-concept/WP-C-01-item-definition.md §1.1, §9", "assurance/00-assessment/gap-assessment.md §8"]
  status: applied
  answer: {choice: A, via: chat, at: 2026-10-20}
  applied: {ref: "openamrobot-assurance main", record: "case/configurations CFG-002; WP-C-01 v0.4 §1 (two configurations); WP-C-03 v0.4 and WP-C-04 v0.2 (configuration stated per row); WP-S-03 v0.3 §7", at: 2026-10-20}

- id: DQ-021
  ref: WP-C-06
  question: "How do the arms work when a person is at the station: stop whenever someone enters the workspace, slow down as they approach, or keep moving under measured force limits?"
  context: >-
    With the arms in the item (DQ-004) and people at the station by design (hand-over, helping with a jam), the
    collaborative mode fixes what the arm safe stop (SF-11) must detect and how much the station can do. A
    safety-rated monitored stop is the simplest and needs only a station field or mat. Speed-and-separation
    monitoring keeps the arm moving while people are far enough away and needs the arm's stopping distance.
    Power-and-force limiting lets a person touch a moving arm and needs the OpenArm 2.0 contact forces measured
    against the ISO/TS 15066 body-region limits, which nobody has published or measured. The arm's reach, torques
    and force limits are not in upstream's record (WP-C-01 OI-6).
  reversibility: revisit
  decider: lead
  blocks: "The demand and the P rating of SF-11 (WP-C-04 §3.11, WP-C-03 H-13); the station detection device of WP-S-03 §3.8; the validation of WP-V-03 (force gauge or field tests)"
  gate: G1
  asked: 2026-10-20
  batch: 2
  options:
    - key: A
      recommended: true
      title: "Safety-rated monitored stop: the arm stops when anyone enters the marked workspace; hand-over only with the arm stopped"
      detail: "Simplest to build and prove with a station field or mat; no force measurement needed. Cost: no helping hand while the arm moves, and throughput falls at a busy station."
    - key: B
      title: "Speed-and-separation monitoring: the arm slows as a person approaches and stops at the protective distance"
      detail: "The arm keeps working with people nearby. Cost: a scanner field around the station and the arm's measured stopping distance to size it; still no contact allowed."
    - key: C
      title: "Power-and-force limiting: a person may touch the moving arm within measured body-region limits"
      detail: "The collaborative use upstream's hand-over scenario implies. Cost: the OpenArm 2.0 forces must be measured per body region and the arm must limit them by design, which is not published; the head stays excluded in every case."
  sources: ["assurance/02-concept/WP-C-06-human-robot-interaction-and-misuse.md §4 CA-02, CA-06", "assurance/02-concept/WP-C-04-safety-functions-and-plr.md §3.11", "ISO 10218-2 §5.10, ISO/TS 15066 §5 (to be checked)"]
  status: applied
  answer: {choice: A, via: chat, at: 2026-10-20}
  applied: {ref: "openamrobot-assurance main", record: "WP-C-04 §3.11 (SF-11 demand: safety-rated monitored stop on entry to the station workspace); WP-C-06 §4 CA-02, CA-06; WP-C-03 §5 H-13 row; WP-S-03 §3.8", at: 2026-10-20}
