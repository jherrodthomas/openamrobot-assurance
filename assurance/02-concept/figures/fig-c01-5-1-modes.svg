<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="580" viewBox="0 0 1180 580" role="img" aria-labelledby="mod-t mod-d">
<title id="mod-t">Figure 5-1: operating modes of the Gate A unit as a state machine</title>
<desc id="mod-d">Seven states M0 off and bench, M1 powered debug, M2 teleoperation, M3 autonomous navigation, M4 docking, M5 mapping and M6 fault or stopped, each with who commands motion and which protective layers are active, joined by labelled transitions; M6 is reached by silence or loss and is left as soon as commands return.</desc>
<defs>
  <marker id="mod-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7E949B"/></marker>
  <marker id="mod-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#D4821A"/></marker>
  <marker id="mod-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#D64535"/></marker>
  <marker id="mod-diamond" viewBox="0 0 12 8" refX="0" refY="4" markerWidth="12" markerHeight="8" orient="auto">
    <path d="M0,4 L6,0 L12,4 L6,8 z" fill="#122026"/></marker>
  <pattern id="mod-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#EDF2F4"/><line x1="0" y1="0" x2="0" y2="10" stroke="#D3DDE2" stroke-width="1.2"/></pattern>
</defs>
