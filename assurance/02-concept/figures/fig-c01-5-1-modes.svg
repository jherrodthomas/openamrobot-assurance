<text x="32.0" y="52.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4E6A73" text-anchor="start">Each state shows who commands motion and which protective layers are active (§5). No transition is arbitrated: the last publisher wins.</text>
