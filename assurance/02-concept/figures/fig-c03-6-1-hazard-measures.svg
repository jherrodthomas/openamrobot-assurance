<title id="hm-t">Figure 6-1: hazard-to-measure matrix</title>
<desc id="hm-d">A grid with the twelve hazards down the side, each with its adopted Performance Level in a coloured chip, and the measures across in four groups: design and complementary measures, operating-environment limits, safety functions and information for use; a dot marks each pair where the measure reduces the hazard.</desc>
