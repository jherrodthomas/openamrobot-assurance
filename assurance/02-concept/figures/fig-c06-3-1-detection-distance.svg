<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="dst-t dst-d">
<title id="dst-t">Figure 3-1: minimum detection distance against the time to standstill</title>
<desc id="dst-d">A line chart with the time to standstill after power removal from zero to two seconds across and the minimum detection distance from zero to four and a half metres up: a teal line for the navigation speed and an amber line for the crawl speed, almost parallel because the walking person dominates; a hatched band above the teal line for the intrusion allowance; a thin dashed grey line for the robot's own travel; a red dashed line at one metre for the starting field, which the navigation line crosses at about four tenths of a second.</desc>
<defs>
  <marker id="dst-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#122026"/></marker>
  <pattern id="dst-grid" patternUnits="userSpaceOnUse" width="36" height="36">
    <path d="M36,0 L0,0 L0,36" fill="none" stroke="#D3DDE2" stroke-width="0.7"/></pattern>
  <pattern id="dst-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#B86F0C" stroke-width="1"/></pattern>
</defs>
<rect x="0" y="0" width="1180" height="560" fill="#FFFFFF"/>
<text x="32.0" y="34.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#122026" text-anchor="start">Figure 3-1  Minimum detection distance L against the time to standstill after power removal</text>
<text x="32.0" y="52.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4E6A73" text-anchor="start">L = v·t_r + d_b + K·(t_r + t_b) + Z + C, with K = 1.6 m/s, t_r = 0.17 s, Z = 0.1 m, d_b = v·t_b/2 (constant deceleration). C drawn as 0 (lines) and as 0.85 m (band top).</text>
