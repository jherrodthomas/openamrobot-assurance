<title id="s04-2-1-t">Figure 2-1: SF-02 by the scanner at navigation speed: demand to standstill, with the distance ledger of field set FS-1b</title>
<desc id="s04-2-1-d">Six boxes from the demand through the scanner, the logic, the contactors, the coast and the standstill with the times of the budget row; a time axis to 0.6 s with the phases and the power-removed and standstill marks; a distance bar to scale adding the reaction travel, the hatched coast, the person's walk and the tolerance to the field length 1.09 m; a floor strip with the robot, its field, the standstill ghost and the person at the demand and at standstill.</desc>
