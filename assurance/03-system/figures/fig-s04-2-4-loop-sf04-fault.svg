<title id="s04-2-4-t">Figure 2-4: SF-04 fault path: channel 1 dead with PWM applied, the hardware watchdog trips the chain</title>
<desc id="s04-2-4-d">Six boxes from the fault through the watchdog window, the logic, the contactors, the coast and the standstill; a time axis to 1.5 s with the window red; a distance bar of the 0.21 m driven with no command and the coast; a floor strip with the robot at the fault, its still-live field and the standstill ghost.</desc>
