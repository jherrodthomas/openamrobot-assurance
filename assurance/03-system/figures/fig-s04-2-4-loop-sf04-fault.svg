<text x="120.0" y="412.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#122026" text-anchor="start">Channel 1 died with PWM applied: no demand, no controlled stop. The hardware watchdog (SR-04.04) trips the chain 1.07 s after the last update (1000 + 50 + 20 ms): 1.07 × 0.2 = 0.21 m driven, then the coast.</text>
<text x="120.0" y="428.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#122026" text-anchor="start">No person is in this ledger: the SF-02 scanner path stays live through channel 2 (FS-1b ahead, teal on the floor). This path bounds how far a faulty drive carries the robot; the window is a parameter (WP-W-09).</text>
