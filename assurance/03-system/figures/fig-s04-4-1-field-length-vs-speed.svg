<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" role="img" aria-labelledby="s04-4-1-t s04-4-1-d">
<title id="s04-4-1-t">Figure 4-1: minimum detection distance against speed</title>
<desc id="s04-4-1-d">A line chart with the robot speed from zero to 1.6 metres per second across and the minimum detection distance from zero to five metres up: four curves for decelerations of 0.1, 0.5, 1.0 and 2.0 metres per second squared, steepest for the slow coast; dashed horizontal lines at one, two and three metres for the starting field and the two candidate scanners; dotted vertical markers at the crawl, navigation, ceiling, person-in-zone and 2.0 ceiling speeds; hollow dots on each row of the field-set table.</desc>
<rect x="0" y="0" width="1180" height="600" fill="#FFFFFF"/>
<text x="32.0" y="34.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#122026" text-anchor="start">Figure 4-1  Minimum detection distance L against speed, for the planning decelerations of §3.1</text>
<text x="32.0" y="52.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4E6A73" text-anchor="start">L = v·t_r + v²/(2a) + K·(t_r + v/a) + Z with t_r = 0.17 s (scanner path), K = 1.6 m/s, Z = 0.1 m, C = 0 (§4.2). Dots are the rows of the §4.1 table.</text>
