# Assumptions of use (AOU-) from WP-C-01 §8 (item definition). Source of truth is WP-C-01.
# Format: case/tools/subsetyaml.py (restricted YAML subset).

- id: AOU-01
  kind: aou
  text: "A trained operator is present, watching the robot, with the means to cut 24 V by hand, for every powered run"
  aou_status: "Procedural only"
  status: proposed
  source: WP-C-01

- id: AOU-02
  kind: aou
  text: "The operating area is clear of people during autonomous navigation, docking and undocking"
  aou_status: "Procedural only"
  status: proposed
  source: WP-C-01

- id: AOU-03
  kind: aou
  text: "Wheels are off the ground whenever a powered debug path or calibration runs"
  aou_status: "Procedural only"
  status: proposed
  source: WP-C-01

- id: AOU-04
  kind: aou
  text: "The battery is at or above 25 V at rest before a run"
  aou_status: "Procedural only"
  status: proposed
  source: WP-C-01

- id: AOU-05
  kind: aou
  text: "The Wi-Fi network carrying DDS is private and reaches only trusted hosts"
  aou_status: "Not stated upstream"
  status: proposed
  source: WP-C-01

- id: AOU-06
  kind: aou
  text: "The floor is flat, dry, indoor, free of steps above the castor limit"
  aou_status: "Assumed"
  status: proposed
  source: WP-C-01

- id: AOU-07
  kind: aou
  text: "The payload is restrained and within a mass and height limit still to be set"
  aou_status: "No limit stated"
  status: proposed
  source: WP-C-01

- id: AOU-08
  kind: aou
  text: "The base does not move while an arm is outside its stowed or carry pose (CFG-002; WP-C-06 CA-01)"
  aou_status: "Planned upstream (LIFT motion rules); no interlock in any repository"
  status: proposed
  source: WP-C-01

- id: AOU-09
  kind: aou
  text: "The lift moves only in the stowed or carry pose with the base stopped, and holds its load on an E-stop and on power loss (CFG-002; upstream LIFT release gates)"
  aou_status: "Planned upstream; the DOLD holding evidence is a release gate not yet passed"
  status: proposed
  source: WP-C-01

- id: AOU-10
  kind: aou
  text: "Nobody is within reach of an arm while it moves, until its power-and-force limiting is measured against ISO/TS 15066 (CFG-002)"
  aou_status: "Procedural only; no arm exists on CFG-001"
  status: proposed
  source: WP-C-01
