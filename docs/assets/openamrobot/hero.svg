<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="hero-t hero-d">
  <title id="hero-t">OpenAMRobot assurance: Open mobile manipulation. Engineered for safety.</title>
  <desc id="hero-d">OpenAMRobot assurance banner: a geometric mobile manipulator in amber with a cyan LiDAR, a red emergency stop and a dashed protective field on a perspective floor grid, beside the project name and the tagline Open mobile manipulation. Engineered for safety. Chips name the standards: ISO 12100, ISO 3691-4, ISO 13849-1, EN 60204-1, IEC 62443, Machinery Reg. (EU) 2023/1230.</desc>
