<!doctype html>
<html><head><meta charset="utf-8"><title>OpenAMRobot render</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><pre id="log" style="position:absolute;left:0;top:0;font:10px monospace;color:#888;margin:0;pointer-events:none"></pre>
<canvas id="c"></canvas>
<script>window.onerror = (m, s, l) => { document.getElementById('log').textContent += 'ERR ' + m + ' ' + l + '\n'; };</script>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module">
// Offscreen three.js render of the robot GLBs. Query: model (path), extra (comma-separated paths drawn in the same frame,
// e.g. the upper body of build_manipulator.py), view (tq|side|top|front), az, el, dist, fov, up (y|z), style (hero recolours
// the parts by name), ghost / hide (node-name substrings), bg (hex or none), w, h.
// render.py drives it and waits for document.title === 'rendered'. Nothing here is evidence: the mesh is a
// presentation asset tessellated from upstream's STEP assembly (see ../README.md).
import * as THREE from 'three';
import { GLTFLoader } from './loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1600, H = +q.get('h') || 1000, view = q.get('view') || 'tq';
const ghost = (q.get('ghost') || '').split(',').filter(Boolean);
const hide = (q.get('hide') || '').split(',').filter(Boolean);
const bg = q.get('bg');
const log = document.getElementById('log'); if (q.get('quiet')) log.style.display = 'none';
const canvas = document.getElementById('c'); canvas.width = W; canvas.height = H;
const r = new THREE.WebGLRenderer({canvas, antialias: true, alpha: true, preserveDrawingBuffer: true});
r.setPixelRatio(1); r.setSize(W, H, false);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
if (bg && bg !== 'none') r.setClearColor(parseInt(bg, 16), 1); else r.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0xcfd8dc, 1.6));
const key = new THREE.DirectionalLight(0xfff4e6, 2.4); key.position.set(-1.2, 2.2, 1.6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 4; key.shadow.bias = +(q.get('sb') || -0.0005); key.shadow.normalBias = +(q.get('nb') || 0);
key.shadow.camera.near = 0.2; key.shadow.camera.far = 10; key.shadow.camera.left = key.shadow.camera.bottom = -1.2; key.shadow.camera.right = key.shadow.camera.top = 1.2; scene.add(key);
const fill = new THREE.DirectionalLight(0xdfefff, 0.9); fill.position.set(1.8, 1.0, -0.6); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.6); rim.position.set(0.4, 1.2, -2.0); scene.add(rim);
// The light palette of make_assets.py, applied by top-level component name (the STEP AP203 file carries few colours)
const HERO = (name, set) => {
  const dark = name.endsWith('|595959') || name.endsWith('|0c0c0c');
  if (name.startsWith('Upper body') || name.startsWith('OpenArm')) {   // build_manipulator.py colours these itself; soften the shells
    if (name.includes('|f6f8f9')) set(0xf6f8f9, 0.45); else if (name.includes('|b9c4c9')) set(0xb9c4c9, 0.4); else if (name.includes('|2f3d44')) set(0x2f3d44, 0.6);
    else if (name.includes('|d64535')) set(0xd64535, 0.45); else if (name.includes('|f2a33a')) set(0xf2a33a, 0.45);
    return;
  }
  if (name.includes('Cover assembly')) set(0xf6f8f9, 0.45);
  else if (name.includes('Base assembly') || name.includes('panel') || name.includes('Panel')) set(0xe3e9ec, 0.5);
  else if (name.includes('Wheel assembly')) set(dark ? 0x2f3d44 : 0x8a979d, 0.7);
  else if (name.includes('bracket') || name.includes('Support') || name.includes('support')) set(0xb9c4c9, 0.55);
  else if (name.includes('camera_mount') && name.endsWith('|0c3ae2')) set(0x0e8c83, 0.4);
  else if (name.includes('B200MK')) set(dark ? 0x3a3a3a : 0xd64535, 0.45);   // emergency-stop mushroom
  else if (name.includes('B100FY')) set(dark ? 0x3a3a3a : 0xf2a33a, 0.45);   // push button
  else if (name.includes('LED RGB')) set(0x3fd3c6, 0.3);
};
const loader = new GLTFLoader();
const files = [q.get('model') || '../robot.glb', ...(q.get('extra') || '').split(',').filter(Boolean)];
Promise.all(files.map(f => loader.loadAsync(f))).then((gs) => {
  const root = new THREE.Group(); gs.forEach(g => root.add(g.scene)); scene.add(root);
  root.scale.setScalar(0.001);                                   // STEP is in millimetres
  if ((q.get('up') || 'y') === 'z') root.rotation.x = -Math.PI / 2;   // three.js is Y up
  root.updateMatrixWorld(true);
  let tris = 0;
  root.traverse(o => {
    if (!o.isMesh) return; tris += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3;
    const name = (o.name || o.parent?.name || '').replace(/_/g, ' ');   // GLTFLoader turns spaces into underscores
    if (hide.some(h => name.includes(h))) { o.visible = false; return; }
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    if (q.get('style') === 'hero') HERO(name, (hex, rough) => { o.material = new THREE.MeshStandardMaterial({color: hex, roughness: rough, metalness: 0.05}); });
    o.castShadow = true; o.receiveShadow = true;
    o.material.roughness = Math.min(0.75, o.material.roughness ?? 0.6); o.material.metalness = Math.min(0.1, o.material.metalness ?? 0.1);
    o.material.side = THREE.DoubleSide;   // a few STEP solids are mirrored instances whose winding is reversed; light both faces
    if (ghost.some(h => name.includes(h))) { o.material.transparent = true; o.material.opacity = 0.28; o.material.depthWrite = false; o.castShadow = false; }
  });
  const box = new THREE.Box3().setFromObject(root); const size = box.getSize(new THREE.Vector3()); const ctr = box.getCenter(new THREE.Vector3());
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({opacity: 0.18}));
  ground.rotation.x = -Math.PI / 2; ground.position.y = box.min.y + 0.001; ground.receiveShadow = true; scene.add(ground);
  const target = new THREE.Vector3(ctr.x, box.min.y + size.y * 0.45, ctr.z);
  key.target.position.copy(target); scene.add(key.target);
  const d = Math.max(size.x, size.y, size.z);
  let cam;
  if (view === 'top') { cam = new THREE.OrthographicCamera(-d * 0.6, d * 0.6, d * 0.6 * H / W, -d * 0.6 * H / W, 0.01, 50); cam.position.set(ctr.x, box.max.y + 5, ctr.z); cam.up.set(0, 0, -1); }
  else if (view === 'side') { cam = new THREE.OrthographicCamera(-d * 0.62, d * 0.62, d * 0.62 * H / W, -d * 0.62 * H / W, 0.01, 50); cam.position.set(ctr.x, target.y, ctr.z + 5); }
  else if (view === 'front') { cam = new THREE.OrthographicCamera(-d * 0.62, d * 0.62, d * 0.62 * H / W, -d * 0.62 * H / W, 0.01, 50); cam.position.set(ctr.x - 5, target.y, ctr.z); }
  else {
    cam = new THREE.PerspectiveCamera(+q.get('fov') || 28, W / H, 0.01, 50);
    const az = (+q.get('az') || 38) * Math.PI / 180, el = (+q.get('el') || 24) * Math.PI / 180, dist = d * (+q.get('dist') || 2.25);
    cam.position.set(target.x + dist * Math.cos(el) * Math.cos(az), target.y + dist * Math.sin(el), target.z + dist * Math.cos(el) * Math.sin(az));
  }
  cam.lookAt(target); cam.updateProjectionMatrix();
  const frame = () => { r.render(scene, cam); requestAnimationFrame(frame); }; frame();
  log.textContent += `ok tris=${tris} size=${size.x.toFixed(3)} ${size.y.toFixed(3)} ${size.z.toFixed(3)}\n`; document.title = 'rendered';
}).catch((e) => { log.textContent += 'LOAD ' + e + '\n'; });
</script></body></html>
