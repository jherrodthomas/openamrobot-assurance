<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="603" viewBox="0 0 1000 603" role="img" aria-labelledby="road-t road-d">
  <title id="road-t">OpenAMRobot assurance roadmap</title>
  <desc id="road-d">Roadmap. Phase 01, Foundation (Active): Governance and safety plan, Baseline gap assessment, Work product register, Integrated process model, Decision register. Phase 02, Safety Engineering (Active): Machine limits and risk assessment, Safety functions and required PL, Detection concept, Cybersecurity threat assessment, Test operations hold point. Phase 03, Build and Verify (Planned): Bench safety hardware, Firmware hardening, Chain design and PL calculation, Stopping and detection tests, Fault injection. Phase 04, Validate and Release (Planned): Validation on the robot, Independent assessment, Technical documentation, Declaration of conformity draft, Field monitoring.</desc>
  <defs>
<linearGradient id="road-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10262B"/><stop offset="1" stop-color="#07151A"/></linearGradient>
<linearGradient id="road-amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B8731C"/><stop offset="0.5" stop-color="#FFD38A"/><stop offset="1" stop-color="#B8731C"/></linearGradient>
  </defs>
